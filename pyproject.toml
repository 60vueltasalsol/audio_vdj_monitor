[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aud-vdj-mon-01"
version = "1.2.0"
description = "Monitor estéreo de pico digital con alerta de CAudioLimiter y atenuación automática para cabina DJ (Virtual DJ · Windows · WASAPI Loopback)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["dj", "virtual-dj", "wasapi", "audio", "vumeter", "limiter", "cabina"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
]
dependencies = [
    "soundcard>=0.4.2",
    "numpy>=1.22.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.4",
    "pyinstaller>=6.0",
]

[project.scripts]
aud-vdj-mon = "aud_vdj_mon_01:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]
